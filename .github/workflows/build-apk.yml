name: Build APK Android

# Dijalankan manual: tab Actions -> "Build APK Android" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang Capacitor
        run: npm install

      - name: Siapkan folder www (isi aplikasi)
        run: |
          mkdir -p www
          cp index.html fitur.html service.html blog.html contact.html absen.html \
             styles.css absen.css script.js absen.js pwa.js sw.js firebase-config.js \
             manifest.json logo.png favicon.png icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Buat proyek Android
        run: npx cap add android

      - name: Tambah izin kamera dan lokasi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Atur nomor versi
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Ganti ikon aplikasi
        continue-on-error: true
        run: |
          R=android/app/src/main/res
          rm -rf "$R/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher.png"
            convert icon-512.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher_round.png"
            convert icon-512.png -resize ${s}x${s} "$R/mipmap-$n/ic_launcher_foreground.png"
          done

      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Beri nama berkas APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Absen-PAUD.apk

      - name: Simpan APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Absen-PAUD-apk
          path: Absen-PAUD.apk

      - name: Terbitkan di Releases (tautan unduh)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Absen PAUD v1.${{ github.run_number }}
          body: Pasang berkas Absen-PAUD.apk di HP Android guru.
          files: Absen-PAUD.apk
          make_latest: true
